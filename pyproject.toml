[project]
name = "pythontraininghall"
version = "0.1.0"
description = "Python训练馆，练习Python技能"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "d2l>=0.17.0",
    "ipython>=9.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "opencv-python>=4.11.0.86",
    "wxpython>=4.2.3",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "langgraph>=1.2.2",
    "langchain>=1.3.2",
    "langchain-openai>=1.2.2",
    "typing-extensions>=4.15.0",
]

# Pytorch配置见: https://uv.doczh.com/guides/integration/pytorch/#pytorch
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

#
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
